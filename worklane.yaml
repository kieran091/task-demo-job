apiVersion: platform/v1
kind: Package
metadata:
  name: task-demo-job
  version: 0.2.0
spec:
  runtime: task/v1
  entrypoint:
    type: python
    handler: ./app/job.py
  build:
    strategy: dockerfile
    context: .
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
  configSchema:
    - name: TASK_COUNT
      type: integer
      mutable: true
  resources:
    cpuMillis: 100
    memoryBytes: 134217728
  restartPolicy: OnFailure
